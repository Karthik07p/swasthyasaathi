# Render blueprint for SwasthyaSaathi (free tier): the API and the hosted web app.
# Dashboard: New + > Blueprint > pick this repo. Then fill in the secret env vars.
services:
  # Web app (static site, served from Render's CDN, never sleeps)
  - type: web
    name: swasthyasaathi
    runtime: static
    rootDir: client
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_BASE
        sync: false # set in the Render dashboard: the API's URL (kept out of the repo)

  - type: web
    name: swasthyasaathi-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false # paste your Atlas connection string
      - key: GEMINI_API_KEY
        sync: false # paste your Gemini key
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
